name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-stack:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for the backend to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "backend healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Smoke-test the API
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/api/signals/status | grep -q '"active_phase"'
          curl -fsS http://localhost:8000/api/intersection/state | grep -q '"density_score"'
          curl -fsS http://localhost:8000/api/explain | grep -q '"density"'

      - name: Smoke-test the dashboard and its proxy
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'

      - name: Check the simulation is actually advancing
        run: |
          set -euo pipefail
          first=$(curl -fsS http://localhost:8000/api/intersection/state | python3 -c 'import json,sys; print(json.load(sys.stdin)["sim_time"])')
          sleep 5
          second=$(curl -fsS http://localhost:8000/api/intersection/state | python3 -c 'import json,sys; print(json.load(sys.stdin)["sim_time"])')
          python3 -c "import sys; sys.exit(0 if float('$second') > float('$first') else 1)" \
            || { echo "sim_time did not advance ($first -> $second)"; docker compose logs --no-color; exit 1; }
          echo "sim_time advanced: $first -> $second"

      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > docker-logs.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Stop stack
        if: always()
        run: docker compose down -v
